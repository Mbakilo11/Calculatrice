<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
</head>
<style>
    *{
        font-family: 'arial', sans-serif;
    }
    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .box-principal{
        width: 350px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        background: black;
        border-radius: 10px;

        .result{
            width: 100%;
            height: 100px;
            background: rgb(106, 106, 106);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            .view{
                font-size: 2.5em;
                color: white;
            }
            .result-view{
                font-size: 2.5em;
                font-weight: bolder;
                color: white;
            }
        }
        .boite-button{
            width: 100%;
            height: 350px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;

            input{
                border-radius: 10%;
                border: none;
                background: rgb(200, 200, 200);
                cursor: pointer;
                font-size: 1em;
            }
        }
        .btn-suprime{
            border: none;
            padding: 10px;
            border-radius: 10px;
            text-transform: uppercase;
            background: rgb(106, 106, 106);
            color: white;
        }
    }
</style>
<body>

    <div class="box-principal">
        <div class="result">
            <h3 class="view"></h3>  <span class="result-view"></span>
        </div>
        <div class="boite-button">
            
            <input type="button" value="1">
            <input type="button" value="2">
            <input type="button" value="3">

            <input type="button" value="/">

            <input type="button" value="4">
            <input type="button" value="5">
            <input type="button" value="6">

            <input type="button" value="*">

            <input type="button" value="7">
            <input type="button" value="8">
            <input type="button" value="9">

            <input type="button" value="-">

            <input type="button" value=".">
            <input type="button" value="0">
            <input type="button" value="+">
            <input type="button" class="igual" value="=">

        </div>
            <button class="btn-suprime">Effacer</button>
        
    </div>
    
    <script>
        let button = document.querySelectorAll('input[type="button"]');
        let result = document.querySelector('.view');
        let resultView = document.querySelector('.result-view');
        let btnSuprime = document.querySelector('.btn-suprime');
        let boiteBtn = document.querySelector('.boite-button');
        let calcul = '';

        button.forEach((element) => {
            element.addEventListener('click', ()=>{
                result.innerHTML += element.value
                calcul += element.value

                if (calcul.includes('=')) {
                    calcul= calcul.substring(0, calcul.length -1)
                    console.log(eval(calcul))
                    resultView.textContent = eval(calcul)
                    boiteBtn.style.pointerEvents = 'none'
                }
                
            })
        });

        

        btnSuprime.addEventListener('click', ()=> {
            window.location.reload(true)
        })
    </script>

</body>
</html>
